<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nệm Thuần Việt – Tư vấn chọn nệm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --hong-50:#fef2f6; --hong-100:#fbd3e0; --hong:#eb2364; --hong-dam:#c41a53; --hong-900:#8a1239;
  --nau-go:#4d3b2f; --trang:#ffffff; --kem:#f8f6f2; --xam-100:#f4f4f5; --xam-200:#e4e4e7; --xam-400:#a1a1aa; --xam-600:#52525b; --muc:#231f20;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Be Vietnam Pro",Montserrat,"Segoe UI",Arial,sans-serif;background:var(--kem);color:var(--muc);display:flex;flex-direction:column;font-size:16px;line-height:1.6}
header{background:var(--hong);color:var(--trang);padding:12px 16px;display:flex;align-items:center;gap:12px}
header img{height:40px;width:auto;display:block}
.dl{font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-weight:800;font-size:12px;line-height:1.2;letter-spacing:.04em;border-left:1px solid rgba(255,255,255,.6);padding-left:12px}
.dl small{display:block;font-weight:700;font-size:11px;opacity:.95;letter-spacing:0}
main{flex:1;overflow-y:auto;padding:16px;max-width:720px;width:100%;margin:0 auto}
.nhanh{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.nhanh button{border:1px solid var(--hong-100);background:var(--trang);color:var(--hong-dam);border-radius:9999px;padding:8px 14px;font:500 14px/1.2 inherit;font-family:inherit;cursor:pointer}
.nhanh button:hover{border-color:var(--hong-dam)}
.tin{max-width:85%;padding:10px 14px;border-radius:16px;margin:8px 0;white-space:pre-wrap;word-wrap:break-word}
.khach{background:var(--hong-dam);color:var(--trang);margin-left:auto;border-bottom-right-radius:4px}
.shop{background:var(--trang);border:1px solid var(--xam-200);border-bottom-left-radius:4px}
.tin.co-anh{max-width:100%;width:100%}
.anh{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.anh button{padding:0;border:1px solid var(--xam-200);border-radius:8px;background:var(--trang);cursor:zoom-in;overflow:hidden;text-align:left;font:inherit;color:inherit}
.anh img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.anh span{display:block;font-size:12px;line-height:1.35;padding:6px 8px;color:var(--nau-go);font-weight:700}
.xem{position:fixed;inset:0;background:var(--muc);z-index:20;display:none;flex-direction:column}
.xem.mo{display:flex}
.xem-tren{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--trang);padding:10px 12px;font-weight:700;font-size:14px}
.xem-tren button,.xem-nut{background:rgba(255,255,255,.15);color:var(--trang);border:0;border-radius:9999px;width:44px;height:44px;font-size:24px;line-height:1;cursor:pointer;flex:none}
.xem-khung{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom pan-x pan-y}
.xem-khung img{max-width:100%;max-height:100%;object-fit:contain}
.xem-duoi{display:flex;justify-content:space-between;padding:10px 12px 16px}
.dat{display:inline-block;margin-top:8px;background:var(--hong-dam);color:var(--trang);border:0;border-radius:8px;padding:8px 14px;font:700 14px/1.2 inherit;font-family:inherit;cursor:pointer}
.dang{color:var(--xam-600);font-size:13px;margin:4px 0}
footer{background:var(--trang);border-top:1px solid var(--xam-200);padding:10px 16px 0}
.go{display:flex;gap:8px;max-width:720px;margin:0 auto}
.go input{flex:1;border:1px solid var(--xam-400);border-radius:8px;padding:12px;font:16px inherit;font-family:inherit;min-width:0}
.go button{background:var(--hong-dam);color:var(--trang);border:0;border-radius:8px;padding:0 18px;font:700 16px inherit;font-family:inherit;cursor:pointer}
.go button:disabled{opacity:.6}
.chan{background:var(--hong-dam);color:var(--trang);margin:10px -16px 0;padding:8px 16px;font-size:13px;line-height:1.45;text-align:center}
.chan a{color:var(--trang);font-weight:700}
.nen{position:fixed;inset:0;background:rgba(35,31,32,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.nen.mo{display:flex}
.hop{background:var(--trang);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 16px;max-height:92vh;overflow-y:auto}
.hop h2{margin:0 0 4px;font:800 22px/1.25 Montserrat,"Segoe UI",Arial,sans-serif;color:var(--hong-dam)}
.hop label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.hop input,.hop textarea{width:100%;border:1px solid var(--xam-400);border-radius:8px;padding:10px;font:16px inherit;font-family:inherit;background:var(--trang);color:var(--muc)}
.hop textarea{min-height:72px}
.goi-y{font-size:13px;color:var(--xam-600)}
.nut2{display:flex;gap:8px;margin-top:16px}
.nut2 button{flex:1;border-radius:8px;padding:12px;font:700 16px inherit;font-family:inherit;cursor:pointer}
.gui{background:var(--hong-dam);color:var(--trang);border:0}
.huy{background:var(--trang);color:var(--xam-600);border:1px solid var(--xam-400)}
.bao{background:var(--hong-50);color:var(--hong-900);border-radius:8px;padding:10px;margin-top:12px;display:none}
:focus-visible{outline:2px solid var(--nau-go);outline-offset:2px}
@media (min-width:720px){.nen{align-items:center}.hop{border-radius:16px}}
</style>
</head>

  <div class="dl">ĐẠI LÝ 608 AN LỘC PHÁT<small>Tư vấn chọn nệm – nhắn là có trả lời</small></div>
</header>
<main id="khung">
  <div class="nhanh" id="nhanh"></div>
  <div id="tin"></div>
</main>
<footer>
  <form class="go" id="go">
    <input id="o" maxlength="500" autocomplete="off" placeholder="Nhập câu hỏi về nệm...">
    <button id="nutgui">Gửi</button>
  </form>
  <div class="chan">Showroom A11 Xuân Phương Garden, P. Trịnh Văn Bô, Hà Nội · Hotline <a href="tel:0369137998">0369 137 998</a></div>
</footer>

<div class="nen" id="nen">
  <form class="hop" id="form">
    <h2>Đặt nệm</h2>
    <div class="goi-y">Để lại thông tin, nhân viên showroom gọi xác nhận giá, phí giao và lên đơn cho mình.</div>
    <label for="facebook">Tên / link Facebook *</label><input id="facebook" maxlength="200" placeholder="để shop tìm lại mình khi cần hỗ trợ">
    <label for="ten">Họ tên người nhận</label><input id="ten" maxlength="100">
    <label for="sdt">Số điện thoại *</label><input id="sdt" inputmode="tel" maxlength="20" required>
    <label for="noidung">Mẫu nệm (tên / size / độ dày / số lượng)</label><textarea id="noidung" maxlength="800"></textarea>
    <label for="diachi">Địa chỉ nhận hàng</label><textarea id="diachi" maxlength="800"></textarea>
    <div class="bao" id="bao"></div>
    <div class="nut2"><button type="button" class="huy" id="dong">Đóng</button><button class="gui" id="gui-don">Gửi thông tin</button></div>
  </form>
</div>

<div class="xem" id="xem" role="dialog" aria-label="Xem ảnh">
  <div class="xem-tren"><span id="xem-so"></span><button type="button" id="xem-dong" aria-label="Đóng">×</button></div>
  <div class="xem-khung" id="xem-khung"><img id="xem-anh" alt="Ảnh mẫu nệm phóng to"></div>
  <div class="xem-duoi"><button type="button" class="xem-nut" id="xem-truoc" aria-label="Ảnh trước">‹</button><button type="button" class="xem-nut" id="xem-sau" aria-label="Ảnh sau">›</button></div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzlkDMBMPsId9rfKfHcMINwxFYiZCTeg_FPpLiQX-TJpayx5VIpt9EMMJzR_Enj3h6i4A/exec';
const _fetch = window.fetch.bind(window);
window.fetch = (url, opt) => {
  if (typeof url !== 'string' || !url.startsWith('/api/')) return _fetch(url, opt);
  const body = opt && opt.body ? JSON.parse(opt.body) : {};
  body.action = url.slice(5);
  return _fetch(API, {method: 'POST', body: JSON.stringify(body)});
};
let dsXem = [], viTri = 0, x0 = null;
function hienAnh() {
  const a = dsXem[viTri];
  document.getElementById('xem-anh').src = a.url;
  document.getElementById('xem-so').textContent = (viTri + 1) + '/' + dsXem.length + (a.ten ? ' · ' + a.ten : '');
  ['xem-truoc', 'xem-sau'].forEach(i => document.getElementById(i).style.visibility = dsXem.length > 1 ? 'visible' : 'hidden');
}
function moAnh(ds, k) { dsXem = ds; viTri = k; hienAnh(); document.getElementById('xem').classList.add('mo'); }
function doiAnh(b) { viTri = (viTri + b + dsXem.length) % dsXem.length; hienAnh(); }
document.getElementById('xem-dong').onclick = () => document.getElementById('xem').classList.remove('mo');
document.getElementById('xem-truoc').onclick = () => doiAnh(-1);
document.getElementById('xem-sau').onclick = () => doiAnh(1);
document.addEventListener('keydown', e => {
  if (!document.getElementById('xem').classList.contains('mo')) return;
  if (e.key === 'Escape') document.getElementById('xem').classList.remove('mo');
  if (e.key === 'ArrowLeft') doiAnh(-1);
  if (e.key === 'ArrowRight') doiAnh(1);
});
const khungXem = document.getElementById('xem-khung');
khungXem.addEventListener('touchstart', e => { x0 = e.touches.length === 1 ? e.touches[0].clientX : null; }, {passive: true});
khungXem.addEventListener('touchend', e => {
  if (x0 === null || (window.visualViewport && window.visualViewport.scale > 1.05)) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 50) doiAnh(dx < 0 ? 1 : -1);
});

const TRANG = 'nem';
const NHANH = ['Xem tất cả mẫu nệm', 'Tư vấn giúp em chọn nệm', 'Nệm 1m6 giá bao nhiêu?', 'Nệm cao su thiên nhiên', 'Em thích nệm êm', 'Có bảo hành, ngủ thử không?', 'Showroom ở đâu?', 'Đặt nệm'];
const CHAO = 'Dạ em chào anh/chị ạ ❤️ Bên em là đại lý Nệm Thuần Việt – Việt Nhật tại Hà Nội. Mình đang tìm nệm kích thước bao nhiêu ạ? Ví dụ 1m2, 1m4, 1m6 hay 1m8 ạ?';
const lich = [];
const $ = id => document.getElementById(id);
const nho = (k, v) => { try { if (v === undefined) return localStorage.getItem('ntv_' + k) || ''; localStorage.setItem('ntv_' + k, v); } catch (e) { return ''; } };
let phien = nho('phien'); if (!phien) { phien = Math.random().toString(36).slice(2); nho('phien', phien); }
(() => { const q = new URLSearchParams(location.search); if (q.get('fb')) nho('facebook', q.get('fb').slice(0, 200)); })();
const lichGui = () => lich.map(x => ({ai: x.ai, noi_dung: x.noi_dung}));

function themTin(m) {
  const d = document.createElement('div');
  d.className = 'tin ' + (m.ai ? 'shop' : 'khach');
  d.textContent = m.noi_dung;
  if (m.anh && m.anh.length) {
    d.classList.add('co-anh');
    const ds = m.anh.map(a => typeof a === 'string' ? {url: a, ten: ''} : a);
    const g = document.createElement('div'); g.className = 'anh';
    ds.forEach((a, k) => {
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Phóng to ' + (a.ten || 'ảnh ' + (k + 1)));
      const i = document.createElement('img'); i.src = a.url; i.alt = a.ten || 'Ảnh mẫu nệm';
      i.onload = () => { $('khung').scrollTop = $('khung').scrollHeight; };
      b.appendChild(i);
      const s = document.createElement('span'); s.textContent = a.ten ? a.ten + ' · Bấm để phóng to' : 'Bấm để phóng to'; b.appendChild(s);
      b.onclick = () => moAnh(ds, k); g.appendChild(b);
    });
    d.appendChild(g);
  }
  if (m.form) {
    const b = document.createElement('button'); b.className = 'dat'; b.type = 'button'; b.textContent = 'Đặt nệm ngay'; b.onclick = moForm;
    d.appendChild(document.createElement('br')); d.appendChild(b);
  }
  $('tin').appendChild(d);
  $('khung').scrollTop = $('khung').scrollHeight;
}

async function hoi(cau) {
  cau = cau.trim(); if (!cau) return;
  const m = {ai: false, noi_dung: cau}; lich.push(m); themTin(m);
  $('nutgui').disabled = true;
  const cho = document.createElement('div'); cho.className = 'dang'; cho.textContent = 'Shop đang trả lời...';
  $('tin').appendChild(cho); $('khung').scrollTop = $('khung').scrollHeight;
  let kq;
  try {
    kq = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({trang: TRANG, phien, lich_su: lichGui()})}).then(r => r.json());
  } catch (e) { kq = {tra_loi: 'Dạ mạng đang chập chờn, anh/chị thử lại hoặc gọi hotline 0369 137 998 nha.', form: true}; }
  cho.remove(); $('nutgui').disabled = false;
  const tl = {ai: true, noi_dung: kq.tra_loi, form: kq.form, anh: kq.anh}; lich.push(tl); themTin(tl);
}

async function xemTatCa() {
  let ds = [];
  try { ds = await fetch('/api/anh-nem').then(r => r.json()); } catch (e) {}
  const tl = {ai: true, noi_dung: ds.length ? 'Dạ em gửi anh/chị toàn bộ mẫu nệm bên em ạ ❤️ Bấm vào ảnh để xem rõ giá từng size. Mình cần size bao nhiêu để em tư vấn đúng mẫu ạ?' : 'Dạ ảnh mẫu đang cập nhật, anh/chị nhắn em size cần tìm nhé ạ.', anh: ds};
  lich.push({ai: true, noi_dung: tl.noi_dung}); themTin(tl);
}

async function moForm() {
  $('bao').style.display = 'none';
  ['facebook', 'ten', 'sdt', 'diachi'].forEach(k => { if (!$(k).value) $(k).value = nho(k); });
  $('nen').classList.add('mo');
  if (lich.some(x => !x.ai)) {
    $('bao').style.display = 'block'; $('bao').textContent = 'Đang điền sẵn từ nội dung chat...';
    try {
      const k = await fetch('/api/dien-form', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({trang: TRANG, phien, lich_su: lichGui()})}).then(r => r.json());
      if (k.facebook && !$('facebook').value) $('facebook').value = k.facebook;
      if (k.ten && !$('ten').value) $('ten').value = k.ten;
      if (k.sdt && !$('sdt').value) $('sdt').value = k.sdt;
      if (k.mon && !$('noidung').value) $('noidung').value = k.mon;
      if (k.dia_chi && !$('diachi').value) $('diachi').value = k.dia_chi;
    } catch (e) {}
    $('bao').style.display = 'none';
  }
}

$('dong').onclick = () => $('nen').classList.remove('mo');
$('form').onsubmit = async e => {
  e.preventDefault();
  if (!$('facebook').value.trim()) {
    $('bao').style.display = 'block'; $('bao').textContent = 'Anh/chị điền giúp em tên hoặc link Facebook để shop tìm lại khi cần hỗ trợ ạ'; $('facebook').focus(); return;
  }
  $('gui-don').disabled = true; $('bao').style.display = 'block'; $('bao').textContent = 'Đang gửi...';
  let k = {};
  try {
    k = await fetch('/api/don', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({trang: TRANG, phien, facebook: $('facebook').value, ten: $('ten').value, sdt: $('sdt').value,
        dia_chi: $('diachi').value, noi_dung: $('noidung').value, lich_su: lichGui()})}).then(r => r.json());
  } catch (e) { k = {loi: 'Mạng lỗi, anh/chị thử lại giúp em ạ'}; }
  $('gui-don').disabled = false;
  if (!k.ok) { $('bao').textContent = k.loi || 'Có lỗi, anh/chị thử lại giúp em ạ'; return; }
  ['facebook', 'ten', 'sdt', 'diachi'].forEach(x => nho(x, $(x).value));
